services:
  - type: web
    name: explaindoc-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 65
    plan: free
    envVars:
      - key: OPENAI_API_BASE
        value: https://openrouter.ai/api/v1
      - key: PINECONE_INDEX_NAME
        value: apirag-1024
    autoDeploy: true
